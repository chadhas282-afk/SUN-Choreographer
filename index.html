<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUN Choreographer — Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app-container">
    
    <header class="app-header">
      <div class="header-logo" style="gap: 12px;">
        <img src="logo.jpg" alt="SUN Logo" class="logo-img" style="height: 44px; width: 44px; border-radius: 8px; object-fit: cover;" />
        <span class="logo-text">SUN Choreographer</span>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-generate" id="btn-generate" aria-label="Generate choreography">
          <span class="btn-generate-icon" aria-hidden="true">▶</span>
          <span>Generate Code</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      
      
      <aside class="sidebar left-sidebar">
        <div class="panel">
          <div class="panel-header">
            <h3>Scene Elements</h3>
            <span class="panel-desc">Layers</span>
          </div>
          <div class="panel-content">
            <div class="element-list" id="element-list" role="list">
              
            </div>

            <div class="add-element-controls">
              <div class="ae-row">
                <input type="text" id="new-el-id" class="ae-input" placeholder="ID (e.g. hero-title)" maxlength="40" autocomplete="off" spellcheck="false" />
              </div>
              <div class="ae-row">
                <select id="new-el-type" class="ae-select">
                  <option value="heading">Heading</option>
                  <option value="text">Text</option>
                  <option value="button">Button</option>
                  <option value="image">Image</option>
                  <option value="card">Card</option>
                  <option value="icon">Icon</option>
                  <option value="nav">Nav</option>
                  <option value="badge">Badge</option>
                </select>
                <select id="new-el-entrance" class="ae-select">
                  <option value="auto">Auto</option>
                  <option value="fade">Fade</option>
                  <option value="slide-up">Slide Up</option>
                  <option value="slide-down">Slide Down</option>
                  <option value="slide-left">Slide Left</option>
                  <option value="slide-right">Slide Right</option>
                  <option value="scale">Scale</option>
                  <option value="rotate">Rotate</option>
                </select>
              </div>
              <button type="button" class="btn-add-element" id="btn-add-element">
                + Add Element
              </button>
            </div>
          </div>
        </div>
      </aside>

      
      <section class="stage">
        <div class="stage-toolbar">
          <span>Live Preview</span>
        </div>
        <div class="stage-canvas">
          <div class="preview-container" id="tool-output-panel" aria-live="polite">
            <div class="output-empty" id="output-empty">
              <div class="output-empty-icon" aria-hidden="true"><img src="logo.jpg" style="height: 48px; width: 48px; border-radius: 8px; object-fit: cover;" alt="SUN Logo"/></div>
              <p>Add elements & click Generate</p>
            </div>
            
            <div class="output-loading" id="output-loading" style="display:none; text-align:center; padding: 4rem 2rem;">
              <div class="loading-spinner" style="font-size: 2.5rem; margin-bottom: 1rem; color: var(--accent-blue); display: inline-block; animation: spin 2s linear infinite;"><img src="logo.jpg" style="height: 48px; width: 48px; border-radius: 8px; object-fit: cover;" alt="SUN Logo"/></div>
              <p style="color: var(--text-muted); font-family: var(--font-mono); font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase;">SUN is generating...</p>
            </div>
            
            <div class="output-content" id="output-content" style="display:none;"></div>
          </div>
        </div>
      </section>

      
      <aside class="sidebar right-sidebar">
        
        
        <div class="panel">
          <div class="panel-header">
            <h3>Animation Preset</h3>
            <span class="panel-desc">Physics Curves</span>
          </div>
          <div class="panel-content">
            <div class="preset-grid" id="preset-grid" role="radiogroup">
              
            </div>
            <button type="button" class="btn-more-presets" id="btn-more-presets">
              ⬎ More Presets (52)
            </button>
          </div>
        </div>

        
        <div class="panel">
          <div class="panel-header">
            <h3>Fine-Tune</h3>
            <span class="panel-desc">Overrides</span>
          </div>
          <div class="panel-content">
            <div class="tuning-controls" id="step-tuning">
              <div class="tuning-group">
                <div class="tuning-label"><span>Origin Direction</span></div>
                <div class="dir-controls" role="radiogroup">
                  <button type="button" class="dir-btn active" data-dir="up" title="Bottom Up">⬆️</button>
                  <button type="button" class="dir-btn" data-dir="down" title="Top Down">⬇️</button>
                  <button type="button" class="dir-btn" data-dir="left" title="Right to Left">⬅️</button>
                  <button type="button" class="dir-btn" data-dir="right" title="Left to Right">➡️</button>
                  <button type="button" class="dir-btn" data-dir="center" title="Center Expand">🗜️</button>
                </div>
              </div>

              <div class="tuning-group">
                <div class="tuning-label"><span>Speed</span><span id="val-speed">1.0x</span></div>
                <input type="range" id="range-speed" min="0.1" max="3.0" step="0.1" value="1.0" class="pro-slider">
              </div>

              <div class="tuning-group">
                <div class="tuning-label"><span>Distance</span><span id="val-distance">1.0x</span></div>
                <input type="range" id="range-distance" min="0" max="3.0" step="0.1" value="1.0" class="pro-slider">
              </div>

              <div class="tuning-group">
                <div class="tuning-label"><span>Overlap</span><span id="val-overlap">1.0x</span></div>
                <input type="range" id="range-overlap" min="-0.5" max="2.0" step="0.1" value="1.0" class="pro-slider">
              </div>
            </div>
          </div>
        </div>
        
        
        <div class="panel panel-flex">
          <div class="panel-header">
            <h3>Export Code</h3>
          </div>
          <div class="panel-content code-export-panel" id="code-export-target">
            
            <div class="export-placeholder">Generate to see code</div>
          </div>
        </div>

      </aside>
    </main>
  </div>

  
  <div id="presets-modal" class="modal-overlay hidden" aria-hidden="true" role="dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h2>All Animation Presets</h2>
        <button type="button" id="btn-close-modal" class="btn-icon">✕</button>
      </div>
      <div class="preset-grid modal-grid" id="modal-preset-grid" role="radiogroup">
        
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
